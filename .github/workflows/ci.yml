name: Typescript CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Update package-lock.json
              run: |
                npm install --package-lock-only

            - name: Install dependencies
              run: |
                npm ci

            - name: Run tests
              run: |
                npm test
